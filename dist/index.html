<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter - Inscription</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .content {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .newsletter-form {
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="email"] {
            width: 100%;
            padding: 18px 24px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="email"]::placeholder {
            color: #999;
        }

        .subscribe-btn {
            width: 100%;
            padding: 18px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .subscribe-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .subscribe-btn:active {
            transform: translateY(0);
        }

        .message {
            min-height: 24px;
            font-size: 1rem;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .message.success {
            color: #059669;
            background-color: #d1fae5;
            border: 1px solid #059669;
        }

        .message.error {
            color: #dc2626;
            background-color: #fee2e2;
            border: 1px solid #dc2626;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .content {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            input[type="email"],
            .subscribe-btn {
                font-size: 1rem;
                padding: 16px 20px;
            }
        }

        @media (max-width: 480px) {
            .content {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 0.95rem;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>Restez Informé</h1>
            <p class="subtitle">Inscrivez-vous à notre newsletter pour recevoir les dernières actualités</p>

            <form id="newsletter-form" class="newsletter-form">
                <div class="form-group">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Entrez votre adresse email"
                        required
                        autocomplete="email"
                    >
                    <button type="submit" class="subscribe-btn">
                        S'inscrire à la Newsletter
                    </button>
                </div>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('newsletter-form');
            const emailInput = document.getElementById('email');
            const messageDiv = document.getElementById('message');

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const email = emailInput.value.trim();

                if (!isValidEmail(email)) {
                    showMessage('Veuillez entrer une adresse email valide.', 'error');
                    return;
                }

                subscribeToNewsletter(email);
            });

            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            function subscribeToNewsletter(email) {
                showMessage('Inscription en cours...', 'info');

                setTimeout(() => {
                    showMessage('Merci ! Vous êtes maintenant inscrit à notre newsletter.', 'success');
                    emailInput.value = '';
                    console.log('Email inscrit:', email);
                }, 1000);
            }

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = 'message ' + type;

                if (type === 'success') {
                    setTimeout(() => {
                        messageDiv.textContent = '';
                        messageDiv.className = 'message';
                    }, 5000);
                }
            }
        });
    </script>
</body>
</html>
